dataset_version: traffic_qwen_sft_official_v1
full_expert_version: traffic_qwen_full_expert_v1
output_dir: outputs/traffic_llm_dataset/official_v1
scoring_config: algorithms/traffic_llm/configs/scoring_v2.yaml

simulation:
  duration_seconds: 300
  step_length: 0.1
  snapshot_interval_seconds: 1.0
  decision_interval: 5.0
  minimum_green: 5.0
  flow_multiplier: 1.0
  workers: 1
  wall_timeout_factor: 25.0
  store_full_vehicle_observation: false
  required_post_event_horizon_s: 90

retention:
  mode: compact

planning:
  slot_seconds: 5
  plan_valid_seconds: 30
  scope_hops: 1
  min_episode_seconds: 60

# 3 periods × 3 scopes × 5 events × 3 seeds = 135 scenarios
# 135 × 6 algorithms = 810 episodes
grid:
  periods:
    - morning_peak
    - off_peak
    - evening_peak
  scopes:
    - east_dense
    - west_dense
    - xiongan_20
  seeds:
    - 42001
    - 42002
    - 42003
  event_types:
    - lane_closure
    - speed_limit
    - accident
    - major_event_opening
    - major_event_closing
  event_start_seconds:
    - 120
  event_duration_seconds:
    - 60
  severity:
    speed_limit:
      target_speed_mps: [8.0]
    major_event_opening:
      vehicle_count: [30]
    major_event_closing:
      vehicle_count: [30]
    lane_closure:
      lane_count: [1]
    accident:
      position_ratio: [0.5]

control_modes:
  - fixed
  - max_pressure
  - sotl
  - ippo
  - mappo
  - cov2x

split:
  seed: 20260909
  train: 0.80
  val: 0.20
  test: 0.0
  holdout_seeds:
    - 42003
  ood_event_fraction: 0.0

anchors:
  offsets_seconds: [0, 15, 30, 45, 60]
  require_horizon_inside_episode: true
