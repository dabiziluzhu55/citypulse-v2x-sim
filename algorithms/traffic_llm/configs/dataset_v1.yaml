dataset_version: traffic_qwen_sft_v1
full_expert_version: traffic_qwen_full_expert_v1
output_dir: outputs/traffic_llm_dataset/v1
scoring_config: algorithms/traffic_llm/configs/scoring_v1.yaml

simulation:
  duration_seconds: 300
  step_length: 0.1
  snapshot_interval_seconds: 1.0
  decision_interval: 5.0
  minimum_green: 5.0
  flow_multiplier: 1.0
  workers: 1
  wall_timeout_factor: 25.0
  store_full_vehicle_observation: false

planning:
  slot_seconds: 5
  plan_valid_seconds: 30
  scope_hops: 1
  min_episode_seconds: 60

grid:
  periods:
    - morning_peak
    - off_peak
    - evening_peak
  scopes:
    - xiongan_20
    - east_dense
    - west_dense
  seeds:
    - 42001
    - 42002
    - 42003
  event_types:
    - lane_closure
    - speed_limit
    - accident
    - major_event_opening
    - major_event_closing
  event_start_seconds:
    - 90
    - 150
    - 210
  event_duration_seconds:
    - 60
    - 90
  severity:
    speed_limit:
      target_speed_mps: [5.0, 8.0]
    major_event_opening:
      vehicle_count: [20, 40]
    major_event_closing:
      vehicle_count: [20, 40]
    lane_closure:
      lane_count: [1]
    accident:
      position_ratio: [0.4, 0.6]

control_modes:
  - fixed
  - max_pressure
  - sotl
  - ippo
  - mappo
  - cov2x

split:
  seed: 20260908
  train: 0.80
  val: 0.10
  test: 0.10
  holdout_seeds:
    - 42003
  ood_event_fraction: 0.15

anchors:
  offsets_seconds: [0, 30, 60]
  require_horizon_inside_episode: true

smoke:
  duration_seconds: 90
  step_length: 0.1
  snapshot_interval_seconds: 1.0
  workers: 1
  periods: [off_peak]
  scopes: [east_dense]
  seeds: [42001]
  event_types: [accident, speed_limit]
  event_start_seconds: [30]
  event_duration_seconds: [20]
  control_modes: [fixed, max_pressure, sotl]
  severity:
    speed_limit:
      target_speed_mps: [5.0]
    accident:
      position_ratio: [0.5]
