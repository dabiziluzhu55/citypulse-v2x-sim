dataset_version: traffic_qwen_holdout_v2_44001
full_expert_version: traffic_qwen_full_expert_v1
output_dir: outputs/traffic_llm_dataset/holdout_v2_44001
scoring_config: algorithms/traffic_llm/configs/scoring_v2.yaml

simulation:
  duration_seconds: 300
  step_length: 0.1
  snapshot_interval_seconds: 1.0
  decision_interval: 5.0
  minimum_green: 5.0
  flow_multiplier: 1.0
  workers: 4
  wall_timeout_factor: 25.0
  store_full_vehicle_observation: false
  required_post_event_horizon_s: 90

retention:
  mode: compact

pipeline:
  freeze_split_before_generate: true
  score_on_generate: false
  build_sft_on_generate: false

planning:
  slot_seconds: 5
  plan_valid_seconds: 30
  scope_hops: 1
  min_episode_seconds: 60

# Final unbiased V2 test. Do NOT run LLM closed-loop until V2 adapter is frozen.
# 3 periods × 3 scopes × 5 events × 1 seed = 45 scenarios
# 45 × 6 expert algorithms + 45 × 3 LLM policies = 405 episodes
grid:
  periods:
    - morning_peak
    - off_peak
    - evening_peak
  scopes:
    - east_dense
    - west_dense
    - xiongan_20
  seeds:
    - 44001
  event_types:
    - lane_closure
    - speed_limit
    - accident
    - major_event_opening
    - major_event_closing
  event_start_seconds:
    - 120
  event_duration_seconds:
    - 60
  severity:
    speed_limit:
      target_speed_mps: [8.0]
    major_event_opening:
      vehicle_count: [30]
    major_event_closing:
      vehicle_count: [30]
    lane_closure:
      lane_count: [1]
    accident:
      position_ratio: [0.5]

control_modes:
  - fixed
  - max_pressure
  - sotl
  - ippo
  - mappo
  - cov2x

split:
  seed: 20260909
  train: 0.0
  val: 0.0
  test: 1.0
  holdout_seeds:
    - 44001
  ood_event_fraction: 0.0

anchors:
  offsets_seconds: [0, 15, 30, 45, 60]
  require_horizon_inside_episode: true
