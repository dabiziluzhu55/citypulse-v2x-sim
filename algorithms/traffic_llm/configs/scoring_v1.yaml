selection_version: scoring_v1
baseline_mode: fixed
minimum_improvement_over_baseline: 0.03
ambiguous_margin: 0.02
min_episode_seconds: 60
missing_metric: ignore
relative_range_epsilon: 0.05

# Group scores are independently min-max normalized within a scenario,
# then combined. TTI / DTP / TPI are highly correlated; only TPI is used
# as the official efficiency index.
groups:
  efficiency:
    weight: 0.28
    metrics:
      - id: traffic_performance_index
        direction: maximize
        weight: 1.0
        source: traffic_eval
      - id: throughput_veh_per_h
        direction: maximize
        weight: 0.45
        source: traffic_eval
      - id: path_avg_speed_kmh
        direction: maximize
        weight: 0.35
        source: traffic_eval
  congestion_safety:
    weight: 0.28
    metrics:
      - id: spillback_rate
        direction: minimize
        weight: 0.55
        source: traffic_eval
      - id: regional_max_queue_length_m
        direction: minimize
        weight: 0.35
        source: traffic_eval
      - id: hard_braking_rate
        direction: minimize
        weight: 0.35
        source: traffic_eval
      - id: window_avg_queue_veh
        direction: minimize
        weight: 0.45
        source: event_window
      - id: window_max_queue_m
        direction: minimize
        weight: 0.30
        source: event_window
  green:
    weight: 0.14
    metrics:
      - id: fuel_intensity_L_per_100km
        direction: minimize
        weight: 1.0
        source: traffic_eval
  completeness:
    weight: 0.10
    metrics:
      - id: completion_rate
        direction: maximize
        weight: 1.0
        source: traffic_eval
  realtime:
    weight: 0.05
    metrics:
      - id: avg_decision_latency_ms
        direction: minimize
        weight: 1.0
        source: traffic_eval
  recovery:
    weight: 0.15
    metrics:
      - id: recovery_time_s
        direction: minimize
        weight: 0.70
        source: recovery
      - id: post_event_avg_queue
        direction: minimize
        weight: 0.30
        source: recovery

recovery:
  version: recovery_v1
  reference_window_before_event_s: 20.0
  consecutive_clear_samples: 3
  sample_interval_s: 1.0
  min_post_event_horizon_s: 20.0
  tolerance:
    avg_queue_rel: 0.15
    max_queue_rel: 0.20
    spillback_abs: 2.0

event_windows:
  version: event_window_v1
  offsets_seconds: [30, 60]
  include_active_event_span: true
