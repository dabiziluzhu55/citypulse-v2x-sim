<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CityPulse V2X Sim · 车路云协同管控仿真展示平台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1b2a'/%3E%3Cpath d='M16 38h32l-5-14H21zM21 38v7m22-7v7M24 42h16' fill='none' stroke='%2322d3ee' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; background: #000; }
      #app-startup-shell { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #000; color: #dff8ff; font-family: "Microsoft YaHei", sans-serif; text-align: center; }
      #app-startup-shell .startup-content { display: grid; justify-items: center; gap: 12px; width: min(440px, calc(100vw - 48px)); }
      #app-startup-shell .startup-spinner { width: 24px; height: 24px; border: 2px solid rgba(158, 223, 255, 0.28); border-top-color: #21e6ff; border-radius: 50%; animation: startup-spin 0.8s linear infinite; }
      #app-startup-shell .startup-title { font-size: 15px; font-weight: 600; }
      #app-startup-shell .startup-detail { color: #8eb7c7; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
      #app-startup-shell .startup-retry { display: none; height: 34px; padding: 0 14px; border: 1px solid #21e6ff; border-radius: 4px; background: #083a55; color: #e7fbff; cursor: pointer; }
      #app-startup-shell.is-error .startup-spinner { display: none; }
      #app-startup-shell.is-error .startup-retry { display: inline-flex; align-items: center; }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #app-startup-shell .startup-spinner { animation: none; } }
    </style>
  </head>
  <body class="dark">
    <div id="app">
      <div id="app-startup-shell" role="status" aria-live="polite">
        <div class="startup-content">
          <span class="startup-spinner" aria-hidden="true"></span>
          <strong class="startup-title">正在启动应用</strong>
          <span class="startup-detail">正在加载界面与地图组件</span>
          <button class="startup-retry" type="button">重新加载应用</button>
        </div>
      </div>
    </div>
    <script>
      window.MAPV_BASE_URL = '/mapvthree/'
      ;(() => {
        const RETRY_KEY = 'citypulse.startup-auto-retry'
        const shell = document.getElementById('app-startup-shell')
        const title = shell && shell.querySelector('.startup-title')
        const detail = shell && shell.querySelector('.startup-detail')
        const retry = shell && shell.querySelector('.startup-retry')
        let mounted = false
        let failed = false

        const describe = (reason) => {
          if (reason instanceof Error) return reason.message
          if (typeof reason === 'string') return reason
          return '入口模块或关键资源未能加载'
        }
        const onError = (event) => {
          if (!mounted) window.__CITYPULSE_STARTUP__.fail(event.error || event.message)
        }
        const onRejection = (event) => {
          if (!mounted) window.__CITYPULSE_STARTUP__.fail(event.reason)
        }
        const timeoutId = window.setTimeout(() => {
          window.__CITYPULSE_STARTUP__.fail(new Error('应用入口加载超过 15 秒'))
        }, 15_000)

        window.__CITYPULSE_STARTUP__ = {
          mounted() {
            mounted = true
            window.clearTimeout(timeoutId)
            window.removeEventListener('error', onError, true)
            window.removeEventListener('unhandledrejection', onRejection)
            try { sessionStorage.removeItem(RETRY_KEY) } catch {}
            shell?.remove()
          },
          fail(reason) {
            if (mounted || failed) return
            failed = true
            window.clearTimeout(timeoutId)
            shell?.classList.add('is-error')
            if (title) title.textContent = '应用程序启动失败'
            if (detail) detail.textContent = describe(reason)
            let autoRetry = false
            try {
              autoRetry = sessionStorage.getItem(RETRY_KEY) !== '1'
              if (autoRetry) sessionStorage.setItem(RETRY_KEY, '1')
            } catch {}
            if (autoRetry) window.setTimeout(() => window.location.reload(), 750)
          },
        }
        retry?.addEventListener('click', () => {
          try { sessionStorage.removeItem(RETRY_KEY) } catch {}
          window.location.reload()
        })
        window.addEventListener('error', onError, true)
        window.addEventListener('unhandledrejection', onRejection)
      })()
    </script>
    <script
      id="app-entry-module"
      type="module"
      src="/src/main.ts"
      onerror="window.__CITYPULSE_STARTUP__?.fail(new Error('应用入口模块加载失败'))"
    ></script>
  </body>
</html>
